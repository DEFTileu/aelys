<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes aelysSk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes aelysBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes aelysSpin{to{transform:rotate(360deg)}}
@keyframes aelysFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){[data-sk],[data-bar],[data-spin]{animation:none!important}}
html[data-aelys-theme="dark"] [data-sk]{background-image:linear-gradient(90deg,#26232E 30%,#322E3B 50%,#26232E 70%)!important}
</style>
</helmet>
<div role="status" aria-live="polite" aria-busy="{{ busy }}" style="display:flex;flex-direction:column;gap:14px;animation:aelysFade .2s ease-out">
  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">{{ srText }}</span>
  <sc-if value="{{ busy }}">
    <div aria-hidden="true" style="height:3px;border-radius:2px;background:#EEE8FD;overflow:hidden"><span data-bar="" style="display:block;width:38%;height:100%;border-radius:2px;background:#6A4CF2;animation:aelysBar 1.1s cubic-bezier(.4,0,.2,1) infinite"></span></div>
  </sc-if>

  <sc-if value="{{ slow }}">
    <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid #EDE8E3;box-shadow:0 8px 24px rgba(40,30,30,.05);flex-wrap:wrap">
      <span data-spin="" style="width:20px;height:20px;flex:none;border-radius:50%;border:2.5px solid #EEE8FD;border-top-color:#6A4CF2;animation:aelysSpin .9s linear infinite"></span>
      <div style="flex:1;min-width:180px"><div style="font-weight:600">Taking longer than usual</div><div style="font-size:13px;color:#625D69">Your Aelys server is waking up. This can take up to 30 seconds.</div></div>
      <button type="button" onClick="{{ retry }}" style="height:36px;padding:0 14px;border-radius:10px;background:#F7F4F1;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:#EFE9E3">Retry</button>
    </div>
  </sc-if>

  <sc-if value="{{ error }}">
    <div style="min-height:{{ errH }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:32px 20px;border-radius:24px;background:rgba(255,255,255,.88);border:1px solid #EDE8E3">
      <span style="width:56px;height:56px;border-radius:16px;background:#FDE8E7;color:#C9302C;display:flex;align-items:center;justify-content:center;font-size:26px"><i class="icon-wifi-off"></i></span>
      <div style="font-size:18px;line-height:26px;font-weight:600;margin-top:4px">Can’t reach Aelys</div>
      <div style="font-size:14px;line-height:21px;color:#625D69;max-width:360px">Check your connection. Anything you change is saved on this device and syncs when you’re back online.</div>
      <div style="display:flex;gap:8px;margin-top:8px"><button type="button" onClick="{{ retry }}" style="height:40px;padding:0 18px;border-radius:12px;background:#6A4CF2;color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer" style-hover="background:#5132D6"><i class="icon-rotate-ccw"></i>Try again</button></div>
    </div>
  </sc-if>

  <sc-if value="{{ showSk }}">
    <div aria-hidden="true" style="display:grid;grid-template-columns:{{ cols }};gap:{{ gap }};align-items:start">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
        <div style="grid-column:{{ c.col }};min-height:{{ c.h }};padding:{{ pad }};border-radius:20px;background:rgba(255,255,255,.88);border:1px solid #EDE8E3;display:flex;flex-direction:column;gap:14px">
          <sc-if value="{{ c.head }}"><div style="display:flex;align-items:center;gap:10px"><span data-sk="" style="display:block;width:28px;height:28px;flex:none;border-radius:8px;background:linear-gradient(90deg,#EEE8E2 30%,#F8F5F2 50%,#EEE8E2 70%);background-size:200% 100%;animation:aelysSk 1.4s ease-in-out infinite"></span><span data-sk="" style="display:block;width:{{ c.hw }};height:14px;border-radius:7px;background:linear-gradient(90deg,#EEE8E2 30%,#F8F5F2 50%,#EEE8E2 70%);background-size:200% 100%;animation:aelysSk 1.4s ease-in-out infinite"></span></div></sc-if>
          <sc-for list="{{ c.rows }}" as="r" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:12px;min-height:{{ r.mh }}">
              <sc-if value="{{ r.hasAv }}"><span data-sk="" style="display:block;width:{{ r.av }};height:{{ r.av }};flex:none;border-radius:{{ r.avR }};background:linear-gradient(90deg,#EEE8E2 30%,#F8F5F2 50%,#EEE8E2 70%);background-size:200% 100%;animation:aelysSk 1.4s ease-in-out infinite"></span></sc-if>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px"><span data-sk="" style="display:block;width:{{ r.w1 }};height:12px;border-radius:6px;background:linear-gradient(90deg,#EEE8E2 30%,#F8F5F2 50%,#EEE8E2 70%);background-size:200% 100%;animation:aelysSk 1.4s ease-in-out infinite"></span><sc-if value="{{ r.two }}"><span data-sk="" style="display:block;width:{{ r.w2 }};height:10px;border-radius:5px;background:linear-gradient(90deg,#EEE8E2 30%,#F8F5F2 50%,#EEE8E2 70%);background-size:200% 100%;animation:aelysSk 1.4s ease-in-out infinite"></span></sc-if></div>
              <sc-if value="{{ r.tail }}"><span data-sk="" style="display:block;width:{{ r.tw }};height:{{ r.th }};flex:none;border-radius:{{ r.tr }};background:linear-gradient(90deg,#EEE8E2 30%,#F8F5F2 50%,#EEE8E2 70%);background-size:200% 100%;animation:aelysSk 1.4s ease-in-out infinite"></span></sc-if>
            </div>
          </sc-for>
          <sc-for list="{{ c.lines }}" as="l" hint-placeholder-count="2"><span data-sk="" style="display:block;width:{{ l.w }};height:{{ l.h }};margin-left:{{ l.ml }};border-radius:{{ l.r }};background:linear-gradient(90deg,#EEE8E2 30%,#F8F5F2 50%,#EEE8E2 70%);background-size:200% 100%;animation:aelysSk 1.4s ease-in-out infinite"></span></sc-for>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:640},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;list&quot;,&quot;split&quot;,&quot;grid&quot;,&quot;calendar&quot;,&quot;chat&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;split&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;loading&quot;,&quot;slow&quot;,&quot;error&quot;],&quot;default&quot;:&quot;loading&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Notes&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onRetry&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = this.props, compact = !!P.compact, kind = P.kind || 'list', phase = P.phase || 'loading';
    const W = ['72%', '58%', '84%', '46%', '66%', '78%', '52%', '62%'];
    const rows = (n, o) => Array.from({ length: n }, (_, i) => Object.assign({ hasAv: true, av: '20px', avR: '50%', w1: W[i % 8], two: false, w2: W[(i + 3) % 8], tail: false, tw: '44px', th: '10px', tr: '5px', mh: '28px' }, o || {}));
    const lines = arr => arr.map(x => typeof x === 'string' ? { w: x, h: '12px', r: '6px', ml: '0' } : Object.assign({ h: '12px', r: '6px', ml: '0' }, x));
    const card = o => Object.assign({ col: 'auto', h: '0', head: false, hw: '40%', rows: [], lines: [] }, o);
    let cols = 'minmax(0,1fr)', cards = [];
    const para = lines([{ w: '46%', h: '22px', r: '8px' }, '100%', '96%', '88%', '64%', { w: '0', h: '6px' }, '100%', '92%', '70%']);
    if (kind === 'home') { cols = compact ? 'repeat(2,minmax(0,1fr))' : 'repeat(auto-fill,minmax(240px,1fr))'; cards = (compact ? [2, 1, 1, 2] : [2, 1, 1, 2, 1, 1]).map((s, i) => card({ col: 'span ' + s, h: compact ? (s === 2 ? '150px' : '150px') : '220px', head: true, hw: ['34%', '50%', '46%', '30%', '52%', '44%'][i], lines: lines(s === 2 ? ['80%', '64%', '72%'] : [{ w: '54%', h: '30px', r: '8px' }, '70%']) })); }
    else if (kind === 'list') cards = [card({ rows: rows(compact ? 7 : 9, { tail: !compact, mh: compact ? '40px' : '32px', two: compact }) })];
    else if (kind === 'split') { cols = compact ? 'minmax(0,1fr)' : '320px minmax(0,1fr)'; cards = [card({ rows: rows(compact ? 6 : 8, { av: '36px', two: true, mh: '44px' }) })]; if (!compact) cards.push(card({ h: '520px', lines: para })); }
    else if (kind === 'grid') { cols = compact ? 'minmax(0,1fr)' : 'repeat(auto-fill,minmax(260px,1fr))'; cards = Array.from({ length: compact ? 3 : 6 }, (_, i) => card({ h: compact ? '120px' : '170px', head: true, hw: W[i], lines: lines([W[(i + 2) % 8], { w: '100%', h: '6px', r: '3px' }, '40%']) })); }
    else if (kind === 'calendar') { cols = compact ? 'minmax(0,1fr)' : 'minmax(0,1fr) 300px'; cards = [card({ head: true, hw: '24%', lines: lines([{ w: '100%', h: compact ? '300px' : '460px', r: '14px' }]) })]; if (!compact) cards.push(card({ head: true, hw: '50%', rows: rows(5, { av: '4px', avR: '2px', two: true, mh: '40px' }) })); }
    else if (kind === 'chat') cards = [card({ h: compact ? '420px' : '520px', lines: lines([{ w: '46%', h: '40px', r: '16px' }, { w: '58%', h: '64px', r: '16px', ml: 'auto' }, { w: '38%', h: '40px', r: '16px' }, { w: '64%', h: '88px', r: '16px' }, { w: '30%', h: '40px', r: '16px', ml: 'auto' }]) })];
    else if (kind === 'settings') { cols = compact ? 'minmax(0,1fr)' : '260px minmax(0,1fr)'; cards = [card({ rows: rows(compact ? 6 : 9, { av: '30px', avR: '9px', mh: compact ? '44px' : '36px', two: compact }) })]; if (!compact) cards.push(card({ head: true, hw: '30%', rows: rows(5, { hasAv: false, two: true, tail: true, tw: '44px', th: '26px', tr: '13px', mh: '48px' }) })); }
    const error = phase === 'error', slow = phase === 'slow';
    return {
      busy: !error, slow, error, showSk: !error, cols, cards, gap: compact ? '12px' : '16px', pad: compact ? '14px' : '18px', errH: compact ? '360px' : '440px',
      srText: error ? 'Could not load ' + (P.label || 'this page') : 'Loading ' + (P.label || 'page') + '…',
      retry: () => P.onRetry && P.onRetry(),
    };
  }
}
</script>
</body>
</html>
