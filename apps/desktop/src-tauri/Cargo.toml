[package]
name = "aelys-desktop"
version = "0.1.0"
description = "Aelys macOS desktop shell"
authors = ["Aelys contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "aelys_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-opener = "2.7.2"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aelys-native-transport = { path = "../../../packages/native-transport" }
aelys-runtime = { path = "../../runtime" }
uuid = { version = "1", features = ["serde", "v4"] }
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSButton", "NSOpenPanel", "NSSavePanel", "NSWindow", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in inspector for release builds (right-click > Inspect Element on Mac, chrome://inspect on Android).
devtools = ["tauri/devtools"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
zstd = { version = "0.13.3", default-features = false }
