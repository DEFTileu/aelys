[package]
name = "aelys-desktop"
version = "0.1.0"
description = "Aelys macOS desktop shell"
authors = ["Aelys contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "aelys_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aelys-native-transport = { path = "../../../packages/native-transport" }
aelys-runtime = { path = "../../runtime" }
tauri-plugin-notification = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in inspector for release builds (right-click > Inspect Element on Mac, chrome://inspect on Android).
devtools = ["tauri/devtools"]
