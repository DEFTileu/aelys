[package]
name = "aelys-mobile"
version = "0.1.0"
description = "Aelys Android/mobile Tauri shell"
authors = ["Aelys contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "aelys_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aelys-runtime = { path = "../../runtime" }

[features]
custom-protocol = ["tauri/custom-protocol"]
